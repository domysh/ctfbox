# Builds the CTFBox site and publishes it on GitHub Pages.
#
# The site is the real scoreboard frontend, built from source, served against
# generated API fixtures, plus the configuration editor at /editor. Nothing here
# is a committed snapshot: change the frontend and the demo changes with it,
# admin control room included.
#
# It runs as rarely as it can while still catching a broken site:
#
# * only on the two branches that matter, and only when something that reaches
#   the published page changed - a commit to run.py or to the game server does
#   not move a pixel of it;
# * a pull request from this repository is skipped, because the push that
#   created it already ran. Only a fork's pull request needs its own run, since
#   its pushes never reach us.
name: Site

on:
  push:
    branches: [main, dev]
    paths:
      - "editor/**"
      - "gameserver/frontend/**"
      - "demo/**"
      - ".github/workflows/static.yml"
  pull_request:
    paths:
      - "editor/**"
      - "gameserver/frontend/**"
      - "demo/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  # A deployment is never interrupted halfway through. A check on a branch is:
  # the push that follows it has already made it irrelevant.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build site
    # A pull request opened from a branch of this repository was already built
    # by the push that created it; only a fork needs a run of its own.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install editor dependencies
        working-directory: editor
        run: bun install --frozen-lockfile

      - name: Test the editor
        working-directory: editor
        run: bun test

      - name: Build the editor
        working-directory: editor
        run: bun run build

      - name: Install scoreboard dependencies
        working-directory: gameserver/frontend
        run: bun install --frozen-lockfile

      - name: Build the scoreboard
        working-directory: gameserver/frontend
        run: bun run build

      # Assembles the frontend build, the demo fixtures and the exported editor
      # into _site. The frontend is already built, hence --skip-build.
      - name: Assemble the site
        run: ./demo/build.py --skip-build --out _site

      - name: Check the site is complete
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/api/status
          test -f _site/api/admin/whoami
          test -f _site/editor/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
