# Builds the CTFBox site and publishes it on GitHub Pages.
#
# The site is the real scoreboard frontend, built from source on every push and
# served against generated API fixtures, plus the configuration editor at
# /editor. Nothing here is a committed snapshot: change the frontend and the
# demo changes with it, admin control room included.
name: Site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway through. Branches are grouped separately so
# that a build on a feature branch does not queue behind main.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install editor dependencies
        working-directory: editor
        run: bun install --frozen-lockfile

      - name: Test the editor
        working-directory: editor
        run: bun test

      - name: Build the editor
        working-directory: editor
        run: bun run build

      - name: Install scoreboard dependencies
        working-directory: gameserver/frontend
        run: bun install --frozen-lockfile

      - name: Build the scoreboard
        working-directory: gameserver/frontend
        run: bun run build

      # Assembles the frontend build, the demo fixtures and the exported editor
      # into _site. The frontend is already built, hence --skip-build.
      - name: Assemble the site
        run: ./demo/build.py --skip-build --out _site

      - name: Check the site is complete
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/api/status
          test -f _site/api/admin/whoami
          test -f _site/editor/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
